name: Jest Tests

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_USER: TheBeast
      DB_PASSWORD: WeLoveCOP4331
      DB_NAME: COP4331
      LOGIN_API_URL: http://127.0.0.1:8000/API/Login.php

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: COP4331
          MYSQL_USER: TheBeast
          MYSQL_PASSWORD: WeLoveCOP4331
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test database table
        run: |
          php -r '
            $db = new mysqli(getenv("DB_HOST"), getenv("DB_USER"), getenv("DB_PASSWORD"), getenv("DB_NAME"));
            if ($db->connect_error) {
              fwrite(STDERR, $db->connect_error . PHP_EOL);
              exit(1);
            }
            $sql = "CREATE TABLE Users (
              ID INT AUTO_INCREMENT PRIMARY KEY,
              firstName VARCHAR(50) NOT NULL,
              lastName VARCHAR(50) NOT NULL,
              Login VARCHAR(100) NOT NULL UNIQUE,
              Password VARCHAR(255) NOT NULL
            )";
            if (!$db->query($sql)) {
              fwrite(STDERR, $db->error . PHP_EOL);
              exit(1);
            }
          '

      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 -t "LAMP Stack" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/php-server.pid"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      - name: Run Jest tests
        run: npm run test:ci
